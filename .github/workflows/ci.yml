name: ci

on:
  push:
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  # The 1.27 series always resolves to its latest patch release, which carries the standard-library
  # security fixes (govulncheck flagged net/http issues fixed in 1.27.2). The go.mod directive is only a floor.
  GO_VERSION: "1.27"

jobs:
  # Backend unit and integration tests (internal/api starts the server with a real SQLite through httptest).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Off-site backup script
        run: bash scripts/offsite-backup.test.sh

  # Audits these workflows for injection, over-broad permissions, unpinned actions and similar
  # (github.com/zizmorcore/zizmor). It only reads; findings fail the job and print in the log.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false

  # Go lint per the Uber Go Style Guide (.golangci.yml). Only code a branch adds is checked,
  # so the full history is fetched to find the merge base with master.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Known vulnerabilities in what the code actually calls (Go) and in production dependencies (npm).
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  # Lint, typecheck, unit and component tests (Biome, Vitest + Testing Library).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Full browser flows against the real Go binary, with the embedded frontend, on a desktop and a phone viewport.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  # No dependency cache here: this job builds the production binary, and a cache written by
  # another workflow run must not be able to change what ships.
  build:
    needs: [backend, vuln, web, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o gastos ./cmd/gastos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gastos-linux-amd64
          path: gastos

  # Only master deploys (production). Branches and PRs run the tests and the build, but never publish.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # two merges in a row must not run the deploy script at the same time; the second waits for the first
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: production
      PORT: "8000"
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gastos-linux-amd64
      - name: Upload and activate
        if: env.DEPLOY_HOST != ''
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=${GITHUB_SHA::7}
          ssh="ssh -i ~/.ssh/id deploy@$DEPLOY_HOST"
          $ssh "mkdir -p /opt/gastos/$TARGET/releases/$sha"
          # invite.sh rides with the release, so /opt/gastos/<env>/current/invite.sh always matches the running binary
          scp -i ~/.ssh/id gastos scripts/invite.sh "deploy@$DEPLOY_HOST:/opt/gastos/$TARGET/releases/$sha/"
          $ssh "chmod 755 /opt/gastos/$TARGET/releases/$sha/gastos /opt/gastos/$TARGET/releases/$sha/invite.sh"
          $ssh "bash -s -- $TARGET $sha $PORT" < scripts/remote-deploy.sh
      # The script checks /healthz on localhost; this checks the way users reach the app (DNS, TLS, Caddy).
      # Set the PUBLIC_URL repository variable (for example https://gastos.gupa.dev) to enable it.
      - name: Smoke test the public URL
        if: env.DEPLOY_HOST != '' && env.PUBLIC_URL != ''
        run: |
          for i in $(seq 10); do
            if curl -fsS "$PUBLIC_URL/healthz" >/dev/null; then echo "ok: $PUBLIC_URL/healthz"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep 3
          done
          echo "the public URL is not answering after the deploy" >&2
          exit 1
