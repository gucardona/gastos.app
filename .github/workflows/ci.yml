name: ci

on:
  push:
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  # The 1.27 series always resolves to its latest patch release, which carries the standard-library
  # security fixes (govulncheck flagged net/http issues fixed in 1.27.2). The go.mod directive is only a floor.
  GO_VERSION: "1.27"

jobs:
  # Backend unit and integration tests (internal/api starts the server with a real SQLite through httptest).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Off-site backup script
        run: bash scripts/offsite-backup.test.sh

  # Known vulnerabilities in what the code actually calls (Go) and in production dependencies (npm).
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  # Lint, typecheck, unit and component tests (Biome, Vitest + Testing Library).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Full browser flows against the real Go binary, with the embedded frontend, on a desktop and a phone viewport.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  build:
    needs: [backend, vuln, web, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o gastos ./cmd/gastos
      - uses: actions/upload-artifact@v7
        with:
          name: gastos-linux-amd64
          path: gastos

  # Only master deploys (production). Branches and PRs run the tests and the build, but never publish.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # two merges in a row must not run the deploy script at the same time; the second waits for the first
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: production
      PORT: "8000"
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gastos-linux-amd64
      - name: Upload and activate
        if: env.DEPLOY_HOST != ''
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=${GITHUB_SHA::7}
          ssh="ssh -i ~/.ssh/id deploy@$DEPLOY_HOST"
          $ssh "mkdir -p /opt/gastos/$TARGET/releases/$sha"
          scp -i ~/.ssh/id gastos "deploy@$DEPLOY_HOST:/opt/gastos/$TARGET/releases/$sha/gastos"
          $ssh "chmod +x /opt/gastos/$TARGET/releases/$sha/gastos"
          $ssh "bash -s -- $TARGET $sha $PORT" < scripts/remote-deploy.sh
      # The script checks /healthz on localhost; this checks the way users reach the app (DNS, TLS, Caddy).
      # Set the PUBLIC_URL repository variable (for example https://gastos.gupa.dev) to enable it.
      - name: Smoke test the public URL
        if: env.DEPLOY_HOST != '' && env.PUBLIC_URL != ''
        run: |
          for i in $(seq 10); do
            if curl -fsS "$PUBLIC_URL/healthz" >/dev/null; then echo "ok: $PUBLIC_URL/healthz"; exit 0; fi
            echo "attempt $i failed; retrying"; sleep 3
          done
          echo "the public URL is not answering after the deploy" >&2
          exit 1
