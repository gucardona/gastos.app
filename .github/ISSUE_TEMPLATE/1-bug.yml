name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste personal financial data, passwords or API keys. This repository is public.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Phone
        - Desktop
        - Installed app (PWA)
        - API / server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit shown in the app or by /healthz, if you know it.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Blur amounts and names before attaching.
