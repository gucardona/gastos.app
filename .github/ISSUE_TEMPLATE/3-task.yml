name: Task
description: Maintenance, refactoring, docs or tooling, with no new behavior.
labels: [task]
body:
  - type: textarea
    id: what
    attributes:
      label: What
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
