version: 2

# Weekly update PRs, minor and patch bumps grouped so there is one PR per ecosystem instead of a flood.
# The cooldown skips releases younger than 7 days, so a hijacked release is usually yanked first.
# Security updates ignore the cooldown.
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
