<!DOCTYPE html>
<html lang="pt-BR" x-data="app()" x-init="init()" :data-theme="theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#023848" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="gastos.app" />
  <meta name="format-detection" content="telephone=no" />
  <title>gastos.app</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f3f7f7;--surface:#fff;--surface2:#e8eff0;--border:#d4e0e3;--muted:#9daeb3;
      --text:#16323a;--text2:#5f747b;--accent:#023848;--accent-dim:#d7e9ee;
      --income:#4ecc73;--income-dim:#e2f8e8;--danger:#cf4a4a;--warn:#d68c1d;
      --invest:#1f8a7c;--invest-dim:#d8f1ed;--shadow:0 1px 3px #02384810,0 6px 18px #0238480a;
      --sans:'Outfit',sans-serif;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-right:env(safe-area-inset-right, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --safe-left:env(safe-area-inset-left, 0px);
    }
    [data-theme="dark"]{
      --bg:#071f29;--surface:#0c2b36;--surface2:#103542;--border:#174856;--muted:#5d7d85;
      --text:#eaf4f5;--text2:#95b1b8;--accent:#023848;--accent-dim:#12485a;
      --income:#4ecc73;--income-dim:#143d20;--danger:#f08080;--warn:#f3c45a;
      --invest:#53c2b3;--invest-dim:#123f3a;--shadow:0 1px 4px #00000050,0 4px 16px #00000030;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;transition:background .25s,color .25s;-webkit-text-size-adjust:100%}
    body{min-height:100dvh}
    input,select,button,textarea{font:inherit}
    button,input,select,textarea{-webkit-tap-highlight-color:transparent}
    [x-cloak]{display:none!important}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}

    /* ── Loading overlay ── */
    .loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:12px;padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left))}
    .loading-spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:12px;color:var(--text2);font-weight:300}

    /* ── Login ── */
    .login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeUp .25s ease;padding:calc(18px + var(--safe-top)) calc(16px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(16px + var(--safe-left))}
    .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 32px);overflow:auto;box-shadow:0 8px 40px #00000014}
    .login-logo{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;text-align:center}
    .login-logo span{color:var(--income);font-weight:600}
    .login-tagline{font-size:12px;color:var(--text2);font-weight:300;margin-bottom:32px;text-align:center}
    .login-title{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;text-align:center}
    .login-sub{font-size:12px;color:var(--text2);font-weight:300;margin-bottom:24px;text-align:center}
    .lfield{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
    .lfield label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);font-weight:500;text-align:center;display:block}
    .lfield input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 13px;color:var(--text);font-family:var(--sans);font-size:16px;outline:none;transition:border-color .15s;width:100%}
    .lfield input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,159,255,.15)}
    .lfield input::placeholder{color:var(--muted)}
    .login-err{background:#fee2e2;border:1px solid #fca5a5;border-radius:7px;padding:9px 12px;font-size:12px;color:#991b1b;margin-bottom:14px}
    [data-theme="dark"] .login-err{background:#3a1010;border-color:#7f1d1d;color:#fca5a5}
    .login-switch{text-align:center;font-size:12px;color:var(--text2);margin-top:18px;font-weight:300}
    .login-switch a{color:var(--accent);cursor:pointer;font-weight:500}
    .login-switch a:hover{text-decoration:underline}
    .login-divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:11px}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .btn-loading{opacity:.7;pointer-events:none}

    /* ── App shell ── */
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}

    /* ── Sidebar ── */
    .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100dvh;overflow-y:auto}
    .sidebar-top{padding:0 20px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
    .logo{font-size:15px;font-weight:700;color:var(--text)}
    .logo span{color:var(--income);font-weight:600}
    .nav{padding:16px 10px;flex:1}
    .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;padding:8px 10px 4px}
    .nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:1px;border:1px solid transparent;user-select:none;min-height:44px}
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,87,184,.25);font-weight:500}
    .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .sidebar-bottom{padding:14px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
    .month-nav{display:flex;align-items:center;justify-content:space-between}
    .month-nav button{background:none;border:1px solid var(--border);color:var(--text2);width:22px;height:22px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
    .month-nav button:hover{border-color:var(--accent);color:var(--accent)}
    .month-lbl{font-size:12px;font-weight:600;color:var(--text);text-transform:capitalize}
    .theme-row{display:flex;align-items:center;justify-content:space-between}
    .theme-row span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:500}
    .tog{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px}
    .tog-btn{padding:3px 9px;border-radius:16px;font-size:10px;color:var(--text2);border:none;background:none;cursor:pointer;font-family:var(--sans);transition:all .2s}
    .tog-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px #0002}

    /* ── Main ── */
    .main{padding:32px 36px;overflow-y:auto}
    .page{display:none}.page.active{display:block;animation:fadeUp .2s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
    .page-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
    .page-sub{font-size:12px;color:var(--text2);margin-top:3px;font-weight:300}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}
    .topbar-profile{display:flex;align-items:center;gap:12px}
    .profile-av{width:42px;height:42px;border-radius:50%;background:var(--accent-dim);border:2px solid rgba(2,56,72,.22);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0}
    /* CHANGE 1: profile-name and profile-email now use accent color */
    .profile-name{font-size:14px;font-weight:600;color:var(--accent)}
    .profile-email{font-size:11px;color:var(--text2);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .account-quick-switch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .account-quick-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
    .account-quick-select{min-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;box-shadow:var(--shadow)}
    .account-quick-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,159,255,.15)}
    .account-management-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    /* CHANGE 2: account-management-card left-aligned */
    .account-management-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);text-align:left}
    .account-management-card.active{background:var(--accent-dim);border-color:rgba(0,87,184,.25)}
    .account-management-main{min-width:0}
    /* CHANGE 2: account-management-name uses accent color */
    .account-management-name{font-size:14px;font-weight:600;color:var(--accent)}
    .account-management-meta{font-size:11px;color:var(--text2);font-weight:300;margin-top:4px}
    .setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
    .setting-row:last-child{border-bottom:none}
    .setting-lbl{font-size:13px;font-weight:400}
    .setting-sub{font-size:11px;color:var(--text2);font-weight:300;margin-top:1px}
    .setting-val{font-size:12px;color:var(--text2);font-weight:300}
    .btn-logout{width:100%;justify-content:center;color:var(--danger);border:1px solid rgba(220,38,38,.3);background:transparent}
    .btn-logout:hover{background:rgba(220,38,38,.07);border-color:var(--danger)}
    .topbar .btn-logout{width:auto}
    .btn-login{width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:8px;border-radius:9px;display:flex}
    .role-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
    .role-badge.reader{background:var(--surface2);color:var(--text2)}
    .role-badge.editor{background:var(--income-dim);color:var(--income)}
    .member-list{display:flex;flex-direction:column;gap:10px}
    .panel-field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
    .panel-field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:500}
    .panel-field input,.panel-field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;transition:border-color .15s;width:100%}
    .panel-field input:focus,.panel-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,159,255,.15)}
    .panel-actions{display:flex;gap:8px;flex-wrap:wrap}
    .panel-actions .btn{flex:1 1 0}
    .panel-note{font-size:11px;line-height:1.5;color:var(--text2);font-weight:300}
    .split-editor{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface2)}
    .split-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .split-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:500}
    .split-total{font-size:11px;color:var(--text2);font-weight:500}
    .split-total.invalid{color:var(--danger)}
    .split-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .split-row{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px}
    .split-person{min-width:0}
    .split-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .split-amount{font-size:11px;color:var(--text2);font-weight:300;margin-top:2px}
    .split-input{display:flex;align-items:center;gap:4px}
    .split-input input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px;color:var(--text);font-size:14px;outline:none;text-align:right}
    .split-input span{font-size:11px;color:var(--text2)}
    .member-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
    .member-main{min-width:0}
    .member-name{font-size:13px;font-weight:600}
    .member-email{font-size:11px;color:var(--text2);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
    .member-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .member-actions select{min-width:110px}
    .empty-panel{padding:16px 14px;border:1px dashed var(--border);border-radius:10px;color:var(--text2);font-size:12px;font-weight:300;text-align:center;background:var(--surface2)}

    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--sans);transition:all .15s;white-space:nowrap;min-height:44px;justify-content:center}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 16px rgba(2,56,72,.28)}
    .btn-income{background:var(--income);color:#fff}
    .btn-income:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
    .btn-ghost:hover{border-color:var(--muted);color:var(--text)}
    .btn-sm{padding:4px 11px;font-size:11px}

    /* ── Cards / Forms ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:24px;box-shadow:var(--shadow)}
    .card-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);font-weight:500;margin-bottom:16px}
    .form-grid{display:grid;gap:10px;align-items:end}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);font-weight:500}
    .field input,.field select{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:12px 11px;color:var(--text);font-family:var(--sans);font-size:16px;outline:none;transition:border-color .15s;width:100%;-webkit-appearance:none}
    .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,159,255,.15)}
    .field input::placeholder{color:var(--muted)}
    .field select option{background:var(--surface2)}
    .money-input::-webkit-outer-spin-button,.money-input::-webkit-inner-spin-button{appearance:none;-webkit-appearance:none;margin:0}
    .money-input[type=number]{appearance:textfield;-moz-appearance:textfield}
    .date-picker{cursor:pointer}
    .flatpickr-calendar{border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px #00000018;background:var(--surface);font-family:var(--sans)}
    .flatpickr-months .flatpickr-month,.flatpickr-current-month .flatpickr-monthDropdown-months,.flatpickr-current-month input.cur-year{color:var(--text);fill:var(--text)}
    .flatpickr-weekday,.flatpickr-weekdays{background:transparent;color:var(--text2)}
    .flatpickr-day{color:var(--text);border-radius:10px}
    .flatpickr-day:hover{background:var(--surface2);border-color:var(--surface2)}
    .flatpickr-day.selected,.flatpickr-day.startRange,.flatpickr-day.endRange{background:var(--accent);border-color:var(--accent)}
    .flatpickr-day.today{border-color:var(--accent);color:var(--accent)}
    [data-theme="dark"] .flatpickr-calendar,[data-theme="dark"] .flatpickr-months .flatpickr-month,[data-theme="dark"] .flatpickr-weekdays{background:var(--surface);border-color:var(--border)}

    /* ── Stats ── */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .2s}
    .stat:hover{border-color:var(--muted)}
    .stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:500;margin-bottom:8px}
    .stat-val{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
    .stat-val.green{color:var(--accent)}.stat-val.red{color:var(--danger)}.stat-val.blue{color:var(--income)}
    .stat-meta{font-size:11px;color:var(--text2);margin-top:6px;font-weight:300}

    /* ── Essentiality ── */
    .ess-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;white-space:nowrap}
    .ess-essential{background:var(--accent-dim);color:var(--accent)}
    .ess-nonessential{background:#fff3cd;color:#92400e}
    .ess-investment{background:var(--invest-dim);color:var(--invest)}
    [data-theme="dark"] .ess-nonessential{background:#3d2a00;color:var(--warn)}
    .pay-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:400;background:var(--surface2);color:var(--text2);flex-shrink:0;white-space:nowrap}

    /* ── Transactions ── */
    .tx-list{display:flex;flex-direction:column;gap:1px}
    .tx-item{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:1px solid transparent;transition:all .12s;cursor:default}
    .tx-item:hover{background:var(--surface);border-color:var(--border)}
    .tx-item:hover .tx-del{opacity:1}
    .tx-ico{font-size:17px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:8px;flex-shrink:0}
    .tx-body{min-width:0}
    .tx-row1{display:flex;align-items:center;gap:7px;overflow:hidden}
    .tx-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tx-row2{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
    .tx-meta{font-size:11px;color:var(--text2);font-weight:300}
    .tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .tx-actions{display:flex;align-items:center;gap:4px}
    .tx-amount{font-size:13px;font-weight:600;color:var(--danger);white-space:nowrap}
    .tx-amount.income{color:var(--income)}
    .tx-del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:4px;transition:all .12s}
    .tx-del:hover{color:var(--danger);background:rgba(220,38,38,.1)}
    .tx-edit{opacity:0;background:none;border:none;color:var(--text2);cursor:pointer;font-size:11px;padding:3px 7px;border-radius:999px;transition:all .12s;border:1px solid var(--border)}
    .tx-edit:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
    .tx-item:hover .tx-edit{opacity:1}

    .settings-stack{display:flex;flex-direction:column;gap:16px}
    .settings-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .settings-hero-main{display:flex;flex-direction:column;gap:6px}
    .settings-hero-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
    /* CHANGE 1: settings-hero-owner uses accent color */
    .settings-hero-owner{font-size:12px;color:var(--accent);font-weight:400}
    .info-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2)}
    .recurring-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .recurring-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px}
    .recurring-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .recurring-title{font-size:13px;font-weight:600}
    .recurring-value{font-size:13px;font-weight:600;color:var(--danger);margin-top:4px}
    .recurring-meta-line{font-size:11px;color:var(--text2);font-weight:300;margin-top:6px;line-height:1.5}

    .date-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;padding:12px 0 4px}
    .empty{text-align:center;padding:48px 20px;color:var(--text2)}
    .empty .ei{font-size:36px;margin-bottom:10px}
    .empty p{font-size:12px;font-weight:300}

    /* ── Category bars ── */
    .cat-list{display:flex;flex-direction:column;gap:10px}
    .cat-row{display:grid;grid-template-columns:28px 1fr 100px;gap:10px;align-items:center}
    .cat-bar-bg{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
    .cat-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.16,1,.3,1)}
    .cat-val{font-size:12px;font-weight:300;color:var(--text2);text-align:right}

    /* ── Filter chips ── */
    .filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
    .chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:400;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;font-family:var(--sans)}
    .chip:hover{border-color:var(--muted);color:var(--text)}
    .chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

    /* ── Goals ── */
    .goals-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .goal-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
    .goal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .goal-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
    .goal-amts{font-size:11px;font-weight:300;color:var(--text2)}
    .goal-amts strong{color:var(--text);font-size:13px;font-weight:600}
    .goal-bar-bg{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0 6px}
    .goal-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.16,1,.3,1)}
    .goal-foot{display:flex;justify-content:space-between;align-items:center}
    .goal-pct{font-size:11px;font-weight:300;color:var(--text2)}
    .goal-status{font-size:11px;font-weight:600}
    .goal-status.ok{color:var(--accent)}.goal-status.warn{color:var(--warn)}.goal-status.over{color:var(--danger)}

    /* ── Essentiality summary ── */
    .ess-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
    .ess-card{border-radius:10px;padding:14px 16px}
    .ess-card.essential{background:var(--accent-dim);border:1px solid rgba(0,87,184,.25)}
    .ess-card.nonessential{background:#fff3cd;border:1px solid #f59e0b44}
    .ess-card.investment{background:var(--invest-dim);border:1px solid rgba(124,58,237,.25)}
    [data-theme="dark"] .ess-card.nonessential{background:#3d2a00;border-color:rgba(251,191,36,.2)}
    .ess-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:6px}
    .ess-card.essential .ess-card-label{color:var(--accent)}
    .ess-card.nonessential .ess-card-label{color:#92400e}
    [data-theme="dark"] .ess-card.nonessential .ess-card-label{color:var(--warn)}
    .ess-card.investment .ess-card-label{color:var(--invest)}
    .ess-card-val{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .ess-card.essential .ess-card-val{color:var(--accent)}
    .ess-card.nonessential .ess-card-val{color:#92400e}
    [data-theme="dark"] .ess-card.nonessential .ess-card-val{color:var(--warn)}
    .ess-card.investment .ess-card-val{color:var(--invest)}
    .ess-card-pct{font-size:11px;font-weight:300;color:var(--text2);margin-top:2px}

    /* ── Charts ── */
    .charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
    .chart-card.full{grid-column:1/-1}
    .chart-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);font-weight:500;margin-bottom:16px}
    .chart-wrap{position:relative;height:220px}
    .chart-wrap.tall{height:280px}

    /* ── Toast ── */
    .toast-wrap{position:fixed;bottom:calc(20px + var(--safe-bottom));right:calc(20px + var(--safe-right));z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
    .toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:11px 15px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px #00000030;animation:slideIn .2s ease,fadeOut .3s ease 2.7s forwards;pointer-events:all}
    .toast.err{border-left-color:var(--danger)}
    @keyframes slideIn{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
    @keyframes fadeOut{to{opacity:0;transform:translateX(8px)}}

    /* ── Skeleton loading ── */
    .skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    @media(max-width:960px){
      .app{grid-template-columns:1fr!important}
      .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:8px calc(10px + var(--safe-right)) calc(8px + var(--safe-bottom)) calc(10px + var(--safe-left));border-right:none;border-top:1px solid var(--border);border-bottom:none;z-index:120;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
      [data-theme="dark"] .sidebar{background:rgba(20,23,22,.92)}
      .sidebar-top{display:none}
      .logo,.nav-section,.sidebar-bottom{display:none}
      .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0;gap:6px;align-items:stretch;width:100%}
      .nav-item{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 6px;min-height:58px;text-align:center}
      .nav-item span{display:block;font-size:10px;line-height:1.1}
      .nav-item svg{display:block;width:18px;height:18px}
      .main{padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(108px + var(--safe-bottom)) calc(16px + var(--safe-left))}
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .charts-grid,.goals-grid,.ess-summary,.recurring-grid,.account-management-grid{grid-template-columns:1fr}
      .split-list{grid-template-columns:1fr}
      .chart-card.full{grid-column:auto}
      .form-grid{grid-template-columns:1fr!important}
      .page-header{flex-direction:column;gap:12px}

      /* CHANGE 3: topbar on mobile — profile left, logout right */
      .topbar{align-items:center;flex-wrap:nowrap}
      .topbar-profile{flex:1;min-width:0}
      .account-quick-switch{flex-direction:row;align-items:center;gap:8px;flex-wrap:nowrap}
      .account-quick-label{display:none}
      .account-quick-select{display:none}
      /* logout button stays visible and goes to right */
      .topbar .btn-logout{width:auto;min-height:36px;padding:6px 14px;font-size:12px;flex-shrink:0}

      .account-quick-select{min-width:100%}
      .card,.chart-card,.goal-card,.stat{padding:18px}
      .tx-item{grid-template-columns:32px 1fr auto;gap:10px;padding:12px 8px}
      .tx-ico{width:32px;height:32px;font-size:15px}
      .cat-row{grid-template-columns:24px 1fr 88px;gap:8px}
      .chart-wrap{height:200px}
      .chart-wrap.tall{height:240px}
      .toast-wrap{left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));bottom:calc(88px + var(--safe-bottom))}
      .toast{font-size:12px}
    }

    @media(max-width:560px){
      .login-box{padding:28px 20px;border-radius:14px}
      .page-title{font-size:22px}
      .page-sub{font-size:13px}
      .stats-grid{grid-template-columns:1fr}
      .ess-card{padding:12px 14px}
      .goal-head,.goal-foot{gap:8px;flex-wrap:wrap}
      .tx-row1{align-items:flex-start;flex-direction:column;gap:4px}
      .tx-right{gap:6px}
      .settings-hero{align-items:flex-start}
    }
  </style>
</head>
<body>

<!-- ══ LOADING ══ -->
<div class="loading-overlay" x-show="loading" x-cloak style="display:flex">
  <div class="loading-spinner"></div>
  <div class="loading-text">carregando...</div>
</div>

<!-- ══ LOGIN ══ -->
<div class="login-screen" x-show="!loggedIn && !loading" x-cloak style="display:flex">
  <div class="login-box">
    <div class="login-logo">gastos<span>.app</span></div>
    <div class="login-tagline">Controle financeiro simples e direto</div>

    <!-- Register -->
    <template x-if="loginMode==='register'">
      <div>
        <div class="login-title">Criar conta</div>
        <div class="login-sub">Preencha os dados para começar</div>
        <template x-if="loginError"><div class="login-err" x-text="loginError"></div></template>
        <div class="lfield"><label>Nome</label><input type="text" placeholder="Seu nome" x-model="regForm.name" @keyup.enter="doRegister()" /></div>
        <div class="lfield"><label>E-mail</label><input type="email" placeholder="email@exemplo.com" x-model="regForm.email" @keyup.enter="doRegister()" /></div>
        <div class="lfield"><label>Senha</label><input type="password" placeholder="Mínimo 6 caracteres" x-model="regForm.password" @keyup.enter="doRegister()" /></div>
        <div class="lfield"><label>Confirmar senha</label><input type="password" placeholder="Digite a senha novamente" x-model="regForm.passwordConfirmation" @keyup.enter="doRegister()" /></div>
        <button class="btn btn-primary btn-login" :class="{loading:authLoading}" @click="doRegister()" :disabled="authLoading">
          <span x-text="authLoading?'Criando conta...':'Criar conta'"></span>
        </button>
        <div class="login-switch">Já tem conta? <a @click="loginMode='login';loginError=''">Entrar</a></div>
      </div>
    </template>

    <!-- Login -->
    <template x-if="loginMode==='login'">
      <div>
        <div class="login-title">Bem-vindo de volta</div>
        <div class="login-sub">Entre com suas credenciais</div>
        <template x-if="loginError"><div class="login-err" x-text="loginError"></div></template>
        <div class="lfield"><label>E-mail</label><input type="email" placeholder="email@exemplo.com" x-model="loginForm.email" @keyup.enter="doLogin()" /></div>
        <div class="lfield"><label>Senha</label><input type="password" placeholder="Sua senha" x-model="loginForm.password" @keyup.enter="doLogin()" /></div>
        <button class="btn btn-primary btn-login" :class="{loading:authLoading}" @click="doLogin()" :disabled="authLoading">
          <span x-text="authLoading?'Entrando...':'Entrar'"></span>
        </button>
        <div class="login-divider">ou</div>
        <div class="login-switch">Não tem conta? <a @click="loginMode='register';loginError=''">Criar conta</a></div>
      </div>
    </template>
  </div>
</div>

<!-- ══ APP ══ -->
<div class="app" x-show="loggedIn && !loading" x-cloak style="display:grid">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">gastos<span>.app</span></div>
    </div>
    <nav class="nav">
      <div class="nav-section">Visão</div>
      <div class="nav-item" :class="{active:page==='dashboard'}" @click="page='dashboard'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" :class="{active:page==='charts'}" @click="page='charts';$nextTick(()=>renderCharts())">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Gráficos</span>
      </div>
      <div class="nav-section" style="margin-top:8px">Registros</div>
      <div class="nav-item" :class="{active:page==='expenses'}" @click="page='expenses'">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 8 12 12 15 15"/></svg>
        <span>Gastos</span>
      </div>
      <div class="nav-item" :class="{active:page==='income'}" @click="page='income'">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="8 12 12 8 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>
        <span>Entradas</span>
      </div>
      <div class="nav-section" style="margin-top:8px">Config</div>
      <div class="nav-item" :class="{active:page==='goals'}" @click="page='goals'">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
        <span>Metas</span>
      </div>
      <div class="nav-item" :class="{active:page==='settings'}" @click="page='settings'">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.54V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.54 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.54-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.54-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.7 1.7 0 0 0 9 4.63h.09A1.7 1.7 0 0 0 10.63 3V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9v.09a1.7 1.7 0 0 0 1.54 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>
        <span>Ajustes</span>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <div class="month-nav">
        <button @click="prevMonth()">‹</button>
        <span class="month-lbl" x-text="monthLabel+' '+currentYear"></span>
        <button @click="nextMonth()">›</button>
      </div>
      <div class="theme-row">
        <span>Tema</span>
        <div class="tog">
          <button class="tog-btn" :class="{active:theme==='light'}" @click="setTheme('light')">☀ light</button>
          <button class="tog-btn" :class="{active:theme==='dark'}"  @click="setTheme('dark')">◑ dark</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- CHANGE 3: topbar restructured — profile left, logout right on mobile -->
    <div class="topbar">
      <div class="topbar-profile">
        <div class="profile-av" x-text="userInitials"></div>
        <div>
          <div class="profile-name" x-text="currentUser.name"></div>
          <div class="profile-email" x-text="currentUser.email"></div>
        </div>
      </div>
      <div class="account-quick-switch">
        <span class="account-quick-label">Carteira ativa</span>
        <select class="account-quick-select" :value="activeAccountId" @change="switchAccount($event.target.value)">
          <template x-for="account in accounts" :key="account.id">
            <option :value="String(account.id)" x-text="account.name+' · '+roleLabel(account.role)+' · por '+account.ownerName"></option>
          </template>
        </select>
        <button class="btn btn-ghost btn-logout" @click="doLogout()">Sair</button>
      </div>
    </div>
    <template x-if="!hasActiveAccount">
      <div class="card">
        <div class="card-title">Sem conta ativa</div>
        <div class="page-title" style="font-size:22px;margin-bottom:8px">Crie uma nova conta para começar</div>
        <p class="panel-note" style="max-width:440px;margin-bottom:16px">Você removeu ou ainda não selecionou nenhuma conta. Use a página de ajustes para criar uma conta como "Pessoal", "Casa" ou "Empresa".</p>
        <button class="btn btn-primary" @click="page='settings'">Ir para ajustes</button>
      </div>
    </template>

    <template x-if="hasActiveAccount">
      <div>
        <!-- DASHBOARD -->
        <div class="page" :class="{active:page==='dashboard'}">
          <div class="page-header">
            <div><div class="page-title">Dashboard</div><div class="page-sub" x-text="monthLabel+' '+currentYear+' · '+activeAccountName"></div></div>
            <button class="btn btn-primary" @click="page='expenses'" :disabled="!canEditActiveAccount">+ Gasto</button>
          </div>
          <div class="stats-grid">
            <div class="stat"><div class="stat-lbl">Entradas</div><div class="stat-val blue" x-text="fmt(totalIncome)"></div><div class="stat-meta" x-text="incomeMonth.length+' lançamentos'"></div></div>
            <div class="stat"><div class="stat-lbl">Gastos</div><div class="stat-val red" x-text="fmt(totalExpenses)"></div><div class="stat-meta" x-text="expensesMonth.length+' transações'"></div></div>
            <div class="stat"><div class="stat-lbl">Saldo</div><div class="stat-val" :class="balance>=0?'green':'red'" x-text="fmt(balance)"></div><div class="stat-meta" x-text="balance>=0?'positivo ✓':'negativo ✗'"></div></div>
            <div class="stat"><div class="stat-lbl">Média/dia</div><div class="stat-val" x-text="fmt(dailyAvg)"></div><div class="stat-meta" x-text="daysElapsed+' dias no mês'"></div></div>
          </div>
          <div class="ess-summary">
            <div class="ess-card essential"><div class="ess-card-label">Essencial</div><div class="ess-card-val" x-text="fmt(essentialTotal)"></div><div class="ess-card-pct" x-text="totalExpenses>0?((essentialTotal/totalExpenses)*100).toFixed(0)+'% dos gastos':'—'"></div></div>
            <div class="ess-card nonessential"><div class="ess-card-label">Não essencial</div><div class="ess-card-val" x-text="fmt(nonEssentialTotal)"></div><div class="ess-card-pct" x-text="totalExpenses>0?((nonEssentialTotal/totalExpenses)*100).toFixed(0)+'% dos gastos':'—'"></div></div>
            <div class="ess-card investment"><div class="ess-card-label">Investimento</div><div class="ess-card-val" x-text="fmt(investmentTotal)"></div><div class="ess-card-pct" x-text="totalExpenses>0?((investmentTotal/totalExpenses)*100).toFixed(0)+'% dos gastos':'—'"></div></div>
          </div>
          <div class="card">
            <div class="card-title">Por categoria</div>
            <template x-if="categoryTotals.length===0"><div class="empty"><div class="ei">◈</div><p>Sem gastos no período.</p></div></template>
            <div class="cat-list">
              <template x-for="cat in categoryTotals" :key="cat.id">
                <div style="margin-bottom:2px">
                  <div class="cat-row">
                    <span style="font-size:17px" x-text="cat.icon"></span>
                    <div>
                      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
                        <span style="font-size:12px;font-weight:500" x-text="cat.name"></span>
                        <span :class="'ess-badge ess-'+cat.essentiality" x-text="essLabel(cat.essentiality)"></span>
                      </div>
                      <div class="cat-bar-bg"><div class="cat-bar-fill" :style="{width:cat.pct+'%',background:cat.color}"></div></div>
                    </div>
                    <div class="cat-val" x-text="fmt(cat.total)"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);font-weight:500;margin-bottom:10px">Recentes</div>
          <div class="tx-list">
            <template x-for="tx in recentExpenses" :key="tx.id">
              <div class="tx-item">
                <div class="tx-ico" x-text="getCatIcon(tx.category)"></div>
                <div class="tx-body">
                  <div class="tx-row1"><span class="tx-desc" x-text="tx.description||getCatName(tx.category)"></span><span :class="'ess-badge ess-'+getCatEss(tx.category)" x-text="essLabel(getCatEss(tx.category))"></span></div>
                  <div class="tx-row2"><span class="tx-meta" x-text="formatDate(tx.date)"></span><span class="pay-badge" x-text="payLabel(tx.payment)"></span></div>
                </div>
                <div class="tx-right"><span class="tx-amount" x-text="'− '+fmt(tx.amount)"></span></div>
              </div>
            </template>
            <template x-if="expensesMonth.length===0"><div class="empty"><div class="ei">◎</div><p>Sem gastos no período.</p></div></template>
          </div>
        </div>

        <!-- GRÁFICOS -->
        <div class="page" :class="{active:page==='charts'}">
          <div class="page-header"><div><div class="page-title">Gráficos</div><div class="page-sub" x-text="monthLabel+' '+currentYear+' · '+activeAccountName"></div></div></div>
          <div class="charts-grid">
            <div class="chart-card"><div class="chart-title">Essencial · Não-essencial · Investimento</div><div class="chart-wrap"><canvas id="chartEss"></canvas></div></div>
            <div class="chart-card"><div class="chart-title">Por método de pagamento</div><div class="chart-wrap"><canvas id="chartPay"></canvas></div></div>
            <div class="chart-card full"><div class="chart-title">Gastos por categoria</div><div class="chart-wrap tall"><canvas id="chartCat"></canvas></div></div>
            <div class="chart-card full"><div class="chart-title">Evolução — últimos 6 meses</div><div class="chart-wrap"><canvas id="chartTrend"></canvas></div></div>
          </div>
        </div>

        <!-- GASTOS -->
        <div class="page" :class="{active:page==='expenses'}">
          <div class="page-header"><div><div class="page-title">Gastos</div><div class="page-sub" x-text="monthLabel+' · '+fmt(totalExpenses)+' · '+activeAccountName"></div></div></div>
          <div class="card" x-show="canEditActiveAccount">
            <div class="card-title" x-text="editingExpenseId ? 'Editar gasto' : 'Adicionar gasto'"></div>
            <div class="form-grid" style="grid-template-columns:110px 1fr 170px 160px 160px auto">
              <div class="field"><label>Valor (R$)</label><input class="money-input" type="text" inputmode="numeric" placeholder="0,00" :value="newTx.amount" @input="newTx.amount=formatCurrencyInput($event.target.value)" @keyup.enter="submitExpense()" /></div>
              <div class="field"><label>Descrição</label><input type="text" placeholder="almoço, uber, conta..." x-model="newTx.description" @keyup.enter="submitExpense()" /></div>
              <div class="field"><label>Categoria</label><select x-model="newTx.category"><template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="cat.icon+' '+cat.name"></option></template></select></div>
              <div class="field"><label>Pagamento</label><select x-model="newTx.payment"><template x-for="p in paymentMethods" :key="p.id"><option :value="p.id" x-text="p.label"></option></template></select></div>
              <div class="field"><label>Data</label><input class="date-picker" type="text" x-model="newTx.date" x-init="bindDatePicker($el, newTx, 'date')" readonly /></div>
              <div class="field"><label>&nbsp;</label><button class="btn btn-primary" @click="submitExpense()" :disabled="savingExpense" x-text="savingExpense?'...':(editingExpenseId?'Salvar':'Adicionar')"></button></div>
            </div>
            <div class="split-editor">
              <div class="split-head">
                <div>
                  <div class="split-title">Racha entre participantes</div>
                  <div class="panel-note">A soma precisa fechar em 100%.</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="split-total" :class="{invalid:Math.abs(splitTotal(newTx.splits)-100)>.01}" x-text="splitTotal(newTx.splits).toFixed(2)+'%'"></span>
                  <button class="btn btn-ghost btn-sm" @click="resetSplitPercentages(newTx)">Igualar</button>
                </div>
              </div>
              <div class="split-list">
                <template x-for="split in newTx.splits" :key="'expense-split-'+split.userId">
                  <div class="split-row">
                    <div class="split-person">
                      <div class="split-name" x-text="split.name"></div>
                      <div class="split-amount" x-text="fmt(splitAmountPreview(newTx.amount, split.percentage))"></div>
                    </div>
                    <div class="split-input"><input type="number" min="0" max="100" step="0.01" x-model.number="split.percentage" /><span>%</span></div>
                  </div>
                </template>
              </div>
            </div>
            <div class="panel-actions" x-show="editingExpenseId" style="margin-top:12px">
              <button class="btn btn-ghost" @click="cancelExpenseEdit()">Cancelar edição</button>
            </div>
          </div>
          <div class="card" x-show="canEditActiveAccount">
            <div class="card-title" x-text="editingRecurringId ? 'Editar gasto recorrente' : 'Configurar gasto recorrente'"></div>
            <div class="form-grid" style="grid-template-columns:110px 1fr 170px 160px 110px 160px 160px auto">
              <div class="field"><label>Valor (R$)</label><input class="money-input" type="text" inputmode="numeric" placeholder="0,00" :value="newRecurring.amount" @input="newRecurring.amount=formatCurrencyInput($event.target.value)" @keyup.enter="submitRecurringExpense()" /></div>
              <div class="field"><label>Descrição</label><input type="text" placeholder="academia, streaming..." x-model="newRecurring.description" @keyup.enter="submitRecurringExpense()" /></div>
              <div class="field"><label>Categoria</label><select x-model="newRecurring.category"><template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="cat.icon+' '+cat.name"></option></template></select></div>
              <div class="field"><label>Pagamento</label><select x-model="newRecurring.payment"><template x-for="p in paymentMethods" :key="p.id"><option :value="p.id" x-text="p.label"></option></template></select></div>
              <div class="field"><label>Dia</label><input type="number" min="1" max="31" x-model.number="newRecurring.dayOfMonth" @keyup.enter="submitRecurringExpense()" /></div>
              <div class="field"><label>Início</label><input class="date-picker" type="text" x-model="newRecurring.startDate" x-init="bindDatePicker($el, newRecurring, 'startDate')" readonly /></div>
              <div class="field"><label>Limite</label><input class="date-picker" type="text" x-model="newRecurring.endDate" x-init="bindDatePicker($el, newRecurring, 'endDate', { allowInput: false, allowClear: true })" readonly /></div>
              <div class="field"><label>&nbsp;</label><button class="btn btn-primary" @click="submitRecurringExpense()" :disabled="savingRecurring" x-text="savingRecurring?'...':(editingRecurringId?'Salvar':'Configurar')"></button></div>
            </div>
            <div class="split-editor">
              <div class="split-head">
                <div>
                  <div class="split-title">Racha recorrente</div>
                  <div class="panel-note">Será aplicado em cada cobrança gerada por esta recorrência.</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="split-total" :class="{invalid:Math.abs(splitTotal(newRecurring.splits)-100)>.01}" x-text="splitTotal(newRecurring.splits).toFixed(2)+'%'"></span>
                  <button class="btn btn-ghost btn-sm" @click="resetSplitPercentages(newRecurring)">Igualar</button>
                </div>
              </div>
              <div class="split-list">
                <template x-for="split in newRecurring.splits" :key="'recurring-split-'+split.userId">
                  <div class="split-row">
                    <div class="split-person">
                      <div class="split-name" x-text="split.name"></div>
                      <div class="split-amount" x-text="fmt(splitAmountPreview(newRecurring.amount, split.percentage))"></div>
                    </div>
                    <div class="split-input"><input type="number" min="0" max="100" step="0.01" x-model.number="split.percentage" /><span>%</span></div>
                  </div>
                </template>
              </div>
            </div>
            <div class="panel-actions" style="margin-top:12px">
              <button class="btn btn-ghost" @click="newRecurring.enabled=!newRecurring.enabled" x-text="newRecurring.enabled ? 'Ativa' : 'Pausada'"></button>
              <button class="btn btn-ghost" x-show="editingRecurringId" @click="cancelRecurringEdit()">Cancelar edição</button>
            </div>
            <div class="panel-note" style="margin-top:10px">Configure cobranças mensais com dia fixo, data inicial e data limite opcional. Isso organiza os compromissos recorrentes da carteira ativa.</div>
          </div>
          <template x-if="isAccountReadOnly">
            <div class="card">
              <div class="card-title">Modo leitura</div>
              <p class="panel-note">Você pode acompanhar os gastos desta conta, mas apenas o owner ou um editor podem criar e remover lançamentos.</p>
            </div>
          </template>
          <div class="card">
            <div class="card-title">Recorrentes desta carteira</div>
            <template x-if="recurringExpenses.length===0"><div class="empty"><div class="ei">↻</div><p>Nenhum gasto recorrente configurado.</p></div></template>
            <div class="recurring-grid">
              <template x-for="item in recurringExpenses" :key="item.id">
                <div class="recurring-card">
                  <div class="recurring-top">
                    <div>
                      <div class="recurring-title" x-text="item.description"></div>
                      <div class="recurring-value" x-text="fmt(item.amount)"></div>
                    </div>
                    <span class="role-badge" :class="item.enabled ? 'editor' : 'reader'" x-text="item.enabled ? 'Ativo' : 'Pausado'"></span>
                  </div>
                  <div class="recurring-meta-line" x-text="'Todo dia '+item.dayOfMonth+' · '+getCatName(item.category)+' · '+payLabel(item.payment)"></div>
                  <div class="recurring-meta-line" x-text="splitSummary(item)"></div>
                  <div class="recurring-meta-line" x-text="'Início: '+formatDateLong(item.startDate)+(item.endDate ? ' · até '+formatDateLong(item.endDate) : ' · sem limite')"></div>
                  <div class="panel-actions" x-show="canEditActiveAccount" style="margin-top:12px">
                    <button class="btn btn-ghost btn-sm" @click="startEditRecurringExpense(item)">Editar</button>
                    <button class="btn btn-ghost btn-sm" @click="deleteRecurringExpense(item.id)">Remover</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div class="filter-row">
            <button class="chip" :class="{active:activeFilter==='all'}"          @click="activeFilter='all'">Todos</button>
            <button class="chip" :class="{active:activeFilter==='essential'}"    @click="activeFilter='essential'">Essencial</button>
            <button class="chip" :class="{active:activeFilter==='nonessential'}" @click="activeFilter='nonessential'">Não essencial</button>
            <button class="chip" :class="{active:activeFilter==='investment'}"   @click="activeFilter='investment'">Investimento</button>
            <span style="width:1px;background:var(--border);margin:0 4px;height:18px;align-self:center;display:inline-block"></span>
            <template x-for="cat in categories" :key="cat.id"><button class="chip" :class="{active:activeFilter===cat.id}" @click="activeFilter=cat.id" x-text="cat.icon+' '+cat.name"></button></template>
          </div>
          <div class="tx-list">
            <template x-if="groupedExpenses.length===0"><div class="empty"><div class="ei">◎</div><p>Nenhum gasto encontrado.</p></div></template>
            <template x-for="group in groupedExpenses" :key="group.date">
              <div>
                <div class="date-group" x-text="group.label"></div>
                <template x-for="tx in group.items" :key="tx.id">
                  <div class="tx-item">
                    <div class="tx-ico" x-text="getCatIcon(tx.category)"></div>
                    <div class="tx-body">
                      <div class="tx-row1"><span class="tx-desc" x-text="tx.description||getCatName(tx.category)"></span><span :class="'ess-badge ess-'+getCatEss(tx.category)" x-text="essLabel(getCatEss(tx.category))"></span></div>
                      <div class="tx-row2"><span class="tx-meta" x-text="getCatName(tx.category)"></span><span class="pay-badge" x-text="payLabel(tx.payment)"></span><span class="pay-badge" x-text="splitSummary(tx)"></span></div>
                    </div>
                    <div class="tx-right">
                      <span class="tx-amount" x-text="'− '+fmt(tx.amount)"></span>
                      <div class="tx-actions" x-show="canEditActiveAccount">
                        <button class="tx-edit" @click="startEditExpense(tx)">Editar</button>
                        <button class="tx-del" @click="deleteExpense(tx.id)">✕</button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- ENTRADAS -->
        <div class="page" :class="{active:page==='income'}">
          <div class="page-header"><div><div class="page-title">Entradas</div><div class="page-sub" x-text="monthLabel+' · '+fmt(totalIncome)+' · '+activeAccountName"></div></div></div>
          <div class="card" x-show="canEditActiveAccount">
            <div class="card-title" x-text="editingIncomeId ? 'Editar entrada' : 'Adicionar entrada'"></div>
            <div class="form-grid" style="grid-template-columns:110px 1fr 160px 160px auto">
              <div class="field"><label>Valor (R$)</label><input class="money-input" type="text" inputmode="numeric" placeholder="0,00" :value="newInc.amount" @input="newInc.amount=formatCurrencyInput($event.target.value)" @keyup.enter="submitIncome()" /></div>
              <div class="field"><label>Descrição</label><input type="text" placeholder="salário, freelance..." x-model="newInc.description" @keyup.enter="submitIncome()" /></div>
              <div class="field"><label>Tipo</label><select x-model="newInc.type"><option value="salary">💼 Salário</option><option value="freelance">💻 Freelance</option><option value="investment">📈 Rendimentos</option><option value="gift">🎁 Presente</option><option value="other">◈ Outros</option></select></div>
              <div class="field"><label>Data</label><input class="date-picker" type="text" x-model="newInc.date" x-init="bindDatePicker($el, newInc, 'date')" readonly /></div>
              <div class="field"><label>&nbsp;</label><button class="btn btn-income" @click="submitIncome()" :disabled="savingIncome" x-text="savingIncome?'...':(editingIncomeId?'Salvar':'Adicionar')"></button></div>
            </div>
            <div class="panel-actions" x-show="editingIncomeId" style="margin-top:12px">
              <button class="btn btn-ghost" @click="cancelIncomeEdit()">Cancelar edição</button>
            </div>
          </div>
          <template x-if="isAccountReadOnly">
            <div class="card">
              <div class="card-title">Modo leitura</div>
              <p class="panel-note">Esta conta foi compartilhada com você como leitora. Entradas ficam visíveis, mas não podem ser alteradas.</p>
            </div>
          </template>
          <div class="tx-list">
            <template x-if="groupedIncome.length===0"><div class="empty"><div class="ei">↑</div><p>Sem entradas no período.</p></div></template>
            <template x-for="group in groupedIncome" :key="group.date">
              <div>
                <div class="date-group" x-text="group.label"></div>
                <template x-for="tx in group.items" :key="tx.id">
                  <div class="tx-item">
                    <div class="tx-ico" x-text="incTypeIcon(tx.type)"></div>
                    <div class="tx-body">
                      <div class="tx-row1"><span class="tx-desc" x-text="tx.description||incTypeLabel(tx.type)"></span></div>
                      <div class="tx-row2"><span class="tx-meta" x-text="incTypeLabel(tx.type)"></span></div>
                    </div>
                    <div class="tx-right">
                      <span class="tx-amount income" x-text="'+ '+fmt(tx.amount)"></span>
                      <div class="tx-actions" x-show="canEditActiveAccount">
                        <button class="tx-edit" @click="startEditIncome(tx)">Editar</button>
                        <button class="tx-del" @click="deleteIncome(tx.id)">✕</button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <!-- METAS -->
        <div class="page" :class="{active:page==='goals'}">
          <div class="page-header"><div><div class="page-title">Metas</div><div class="page-sub" x-text="activeAccountName+' · Limites mensais por categoria'"></div></div></div>
          <div class="card" x-show="canEditActiveAccount">
            <div class="card-title" x-text="editingGoalCategory ? 'Editar meta' : 'Nova meta'"></div>
            <div class="form-grid" style="grid-template-columns:1fr 160px auto">
              <div class="field"><label>Categoria</label><select x-model="newGoal.category"><template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="cat.icon+' '+cat.name"></option></template></select></div>
              <div class="field"><label>Limite (R$)</label><input class="money-input" type="text" inputmode="numeric" placeholder="0,00" :value="newGoal.limit" @input="newGoal.limit=formatCurrencyInput($event.target.value)" @keyup.enter="submitGoal()" /></div>
              <div class="field"><label>&nbsp;</label><button class="btn btn-primary" @click="submitGoal()" x-text="editingGoalCategory ? 'Salvar' : 'Definir'"></button></div>
            </div>
            <div class="panel-actions" x-show="editingGoalCategory" style="margin-top:12px">
              <button class="btn btn-ghost" @click="cancelGoalEdit()">Cancelar edição</button>
            </div>
          </div>
          <template x-if="isAccountReadOnly">
            <div class="card">
              <div class="card-title">Modo leitura</div>
              <p class="panel-note">Você pode acompanhar as metas desta conta, mas não pode criar, alterar ou remover limites.</p>
            </div>
          </template>
          <template x-if="goals.length===0"><div class="empty"><div class="ei">◉</div><p>Nenhuma meta definida.</p></div></template>
          <div class="goals-grid">
            <template x-for="goal in goalsWithProgress" :key="goal.category">
              <div class="goal-card">
                <div class="goal-head"><div class="goal-name"><span x-text="getCatIcon(goal.category)"></span><span x-text="getCatName(goal.category)"></span></div><div class="panel-actions" x-show="canEditActiveAccount"><button class="btn btn-ghost btn-sm" @click="startEditGoal(goal)">editar</button><button class="btn btn-ghost btn-sm" @click="deleteGoal(goal.category)">remover</button></div></div>
                <div class="goal-amts"><strong x-text="fmt(goal.spent)"></strong><span x-text="' / '+fmt(goal.limit)"></span></div>
                <div class="goal-bar-bg"><div class="goal-bar-fill" :style="{width:Math.min(goal.pct,100)+'%',background:goal.pct>=100?'var(--danger)':goal.pct>=75?'var(--warn)':'var(--accent)'}"></div></div>
                <div class="goal-foot"><span class="goal-pct" x-text="goal.pct.toFixed(0)+'% utilizado'"></span><span class="goal-status" :class="goal.pct>=100?'over':goal.pct>=75?'warn':'ok'" x-text="goal.pct>=100?'✕ Excedida':goal.pct>=75?'⚠ Atenção':'✓ OK'"></span></div>
              </div>
            </template>
          </div>
        </div>

        <!-- AJUSTES -->
        <div class="page" :class="{active:page==='settings'}">
          <div class="page-header"><div><div class="page-title">Ajustes</div><div class="page-sub" x-text="hasActiveAccount ? activeAccountName+' · '+roleLabel(activeRole) : 'Perfil e carteiras'"></div></div></div>
          <div class="settings-stack">
            <div class="card" x-show="hasActiveAccount">
              <div class="settings-hero">
                <div class="settings-hero-main">
                  <div class="settings-hero-kicker">Carteira ativa</div>
                  <!-- CHANGE 1: page-title in settings uses accent color via CSS -->
                  <div class="page-title" style="font-size:22px;color:var(--accent)" x-text="activeAccountName"></div>
                  <div class="settings-hero-owner" x-text="'Criada por '+activeAccountOwnerName"></div>
                </div>
                <div class="panel-actions">
                  <span class="info-pill" x-text="'Papel: '+roleLabel(activeRole)"></span>
                  <span class="info-pill" x-text="'Saldo atual: '+fmt(balance)"></span>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Trocar e visualizar carteiras</div>
              <div class="panel-field">
                <label>Selecionar carteira</label>
                <select x-model="activeAccountId" @change="switchAccount($event.target.value)">
                  <template x-for="account in accounts" :key="account.id">
                    <!-- CHANGE 2: format "Name · Role" (without "por X") -->
                    <option :value="String(account.id)" x-text="account.name+' · '+roleLabel(account.role)"></option>
                  </template>
                </select>
              </div>
              <div class="account-management-grid" style="margin-top:14px">
                <template x-for="account in accounts" :key="'settings-'+account.id">
                  <!-- CHANGE 2: left-aligned card, no text-align center -->
                  <button class="account-management-card" :class="{active:String(activeAccountId)===String(account.id)}" @click="switchAccount(account.id)">
                    <div class="account-management-main">
                      <!-- CHANGE 2: "Name · Role" format -->
                      <div class="account-management-name" x-text="account.name+' · '+roleLabel(account.role)"></div>
                      <div class="account-management-meta" x-text="'por '+account.ownerName"></div>
                    </div>
                    <span class="role-badge" :class="account.role" x-text="String(activeAccountId)===String(account.id) ? 'Ativa' : roleLabel(account.role)"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Preferências do app</div>
              <div class="setting-row">
                <div><div class="setting-lbl">Tema</div><div class="setting-sub">Aparência do app</div></div>
                <div class="tog">
                  <button class="tog-btn" :class="{active:theme==='light'}" @click="setTheme('light')">☀</button>
                  <button class="tog-btn" :class="{active:theme==='dark'}"  @click="setTheme('dark')">◑</button>
                </div>
              </div>
              <div class="setting-row">
                <div><div class="setting-lbl">Moeda</div><div class="setting-sub">Padrão atual</div></div>
                <div class="setting-val">BRL — R$</div>
              </div>
              <div class="setting-row">
                <div><div class="setting-lbl">Período visualizado</div><div class="setting-sub">Usado no dashboard, gráficos e listas</div></div>
                <div class="setting-val" x-text="monthLabel+' '+currentYear"></div>
              </div>
            </div>

            <div class="card" x-show="hasActiveAccount">
              <div class="card-title">Dados da carteira</div>
              <div class="setting-row">
                <div><div class="setting-lbl">Transações</div></div>
                <div class="setting-val" x-text="expenses.length+' registros'"></div>
              </div>
              <div class="setting-row">
                <div><div class="setting-lbl">Entradas</div></div>
                <div class="setting-val" x-text="incomes.length+' registros'"></div>
              </div>
              <div class="setting-row">
                <div><div class="setting-lbl">Metas ativas</div></div>
                <div class="setting-val" x-text="goals.length+' metas'"></div>
              </div>
              <div class="setting-row">
                <div><div class="setting-lbl">Recorrências</div></div>
                <div class="setting-val" x-text="recurringExpenses.length+' configuradas'"></div>
              </div>
            </div>

            <div class="card" x-show="hasActiveAccount && isAccountOwner">
              <div class="card-title">Gerenciar carteira</div>
              <div class="panel-field">
                <label>Renomear conta</label>
                <input type="text" placeholder="Novo nome" x-model="renameAccountName" @keyup.enter="renameActiveAccount()" />
              </div>
              <div class="panel-actions">
                <button class="btn btn-primary" @click="renameActiveAccount()" :disabled="accountLoading" x-text="accountLoading?'...':'Salvar nome'"></button>
                <button class="btn btn-ghost" @click="deleteActiveAccount()">Excluir conta</button>
              </div>
            </div>

            <div class="card">
              <div class="card-title">Criar nova carteira</div>
              <div class="panel-field">
                <label>Nome da conta</label>
                <input type="text" placeholder="Pessoal, Casa, Empresa..." x-model="accountForm.name" @keyup.enter="createAccount()" />
              </div>
              <div class="panel-actions">
                <button class="btn btn-primary" @click="createAccount()" :disabled="accountLoading" x-text="accountLoading?'...':'Criar conta'"></button>
              </div>
            </div>

            <div class="card" x-show="hasActiveAccount && !isAccountOwner">
              <div class="card-title">Participação</div>
              <p class="panel-note" style="margin-bottom:14px">Se esta carteira foi compartilhada com você, é possível sair dela sem afetar os dados dos demais membros.</p>
              <div class="panel-actions">
                <button class="btn btn-ghost" @click="leaveActiveAccount()">Sair da conta compartilhada</button>
              </div>
            </div>

            <div class="card" x-show="hasActiveAccount && canManageMembers">
              <div class="card-title">Compartilhar carteira</div>
              <div class="panel-field">
                <label>E-mail</label>
                <input type="email" placeholder="usuario@exemplo.com" x-model="shareForm.email" @keyup.enter="shareAccount()" />
              </div>
              <div class="panel-field">
                <label>Papel</label>
                <select x-model="shareForm.role">
                  <option value="reader">Leitor</option>
                  <option value="editor">Editor</option>
                </select>
              </div>
              <div class="panel-actions">
                <button class="btn btn-primary" @click="shareAccount()" :disabled="membersLoading" x-text="membersLoading?'...':'Compartilhar'"></button>
              </div>
              <div class="panel-note" style="margin-top:10px">O compartilhamento v1 funciona com usuários que já possuem conta cadastrada no app.</div>
            </div>

            <div class="card" x-show="hasActiveAccount && canManageMembers">
              <div class="card-title">Membros da carteira</div>
              <div class="member-list">
                <template x-if="accountMembers.length===0">
                  <div class="empty-panel">Nenhum membro extra nesta conta.</div>
                </template>
                <template x-for="member in accountMembers" :key="member.userId">
                  <div class="member-row">
                    <div class="member-main">
                      <div class="member-name" x-text="member.name"></div>
                      <div class="member-email" x-text="member.email"></div>
                    </div>
                    <div class="member-actions">
                      <span class="role-badge" x-show="member.role==='owner'" :class="member.role" x-text="roleLabel(member.role)"></span>
                      <template x-if="member.role!=='owner'">
                        <div class="member-actions">
                          <select style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px" :value="member.role" @change="changeMemberRole(member.userId, $event.target.value)">
                            <option value="reader">Leitor</option>
                            <option value="editor">Editor</option>
                          </select>
                          <button class="btn btn-ghost btn-sm" @click="removeMember(member.userId)">Remover</button>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>

</div>

<div class="toast-wrap">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="{err:t.err}" x-text="t.msg"></div>
  </template>
</div>

<script>
const API = {
  _token: '',
  _accountID: '',
  setToken(t) { this._token = t || '' },
  setAccount(id) { this._accountID = id ? String(id) : '' },
  headers() {
    return {
      'Content-Type': 'application/json',
      ...(this._token ? { Authorization: 'Bearer ' + this._token } : {}),
      ...(this._accountID ? { 'X-Account-ID': this._accountID } : {}),
    }
  },
  async req(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: this.headers(),
      body: body ? JSON.stringify(body) : undefined,
    })
    if (res.status === 204) return null
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'Erro desconhecido')
    return data
  },
  get: (path) => API.req('GET', path),
  post: (path, body) => API.req('POST', path, body),
  patch: (path, body) => API.req('PATCH', path, body),
  delete: (path) => API.req('DELETE', path),
}

function app() {
  return {
    loading: true,
    loggedIn: false,
    authLoading: false,
    accountLoading: false,
    membersLoading: false,
    savingRecurring: false,
    loginMode: 'login',
    loginError: '',
    loginForm: { email: '', password: '' },
    regForm: { name: '', email: '', password: '', passwordConfirmation: '' },
    currentUser: { name: '', email: '' },
    token: '',
    page: 'dashboard',
    theme: 'light',
    toasts: [],
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear(),
    accounts: [],
    activeAccountId: '',
    accountMembers: [],
    accountForm: { name: '' },
    renameAccountName: '',
    shareForm: { email: '', role: 'reader' },
    expenses: [],
    incomes: [],
    goals: [],
    recurringExpenses: [],
    activeFilter: 'all',
    savingExpense: false,
    savingIncome: false,
    editingExpenseId: '',
    editingIncomeId: '',
    editingGoalCategory: '',
    editingRecurringId: '',
    _datePickers: [],
    _charts: {},
    newTx: { amount: '0,00', description: '', category: 'food', payment: 'pix', date: '', splits: [] },
    newInc: { amount: '0,00', description: '', type: 'salary', date: '' },
    newGoal: { category: 'food', limit: '0,00' },
    newRecurring: { amount: '0,00', description: '', category: 'subscriptions', payment: 'credit', frequency: 'monthly', dayOfMonth: 1, startDate: '', endDate: '', enabled: true, splits: [] },

    categories: [
      { id:'food',          name:'Alimentação',  icon:'🍽',  color:'#0f6579', essentiality:'essential' },
      { id:'market',        name:'Mercado',       icon:'🛒',  color:'#1f7d8f', essentiality:'essential' },
      { id:'transport',     name:'Transporte',    icon:'🚗',  color:'#2b92a1', essentiality:'essential' },
      { id:'health',        name:'Saúde',         icon:'💊',  color:'#4ecc73', essentiality:'essential' },
      { id:'home',          name:'Moradia',       icon:'🏠',  color:'#2c9b88', essentiality:'essential' },
      { id:'utilities',     name:'Contas',        icon:'⚡',  color:'#d6a23a', essentiality:'essential' },
      { id:'restaurant',    name:'Restaurante',   icon:'🍜',  color:'#55b38c', essentiality:'nonessential' },
      { id:'leisure',       name:'Lazer',         icon:'🎮',  color:'#66c3a1', essentiality:'nonessential' },
      { id:'subscriptions', name:'Assinaturas',   icon:'📺',  color:'#4ecc73', essentiality:'nonessential' },
      { id:'clothes',       name:'Vestuário',     icon:'👕',  color:'#88c0b3', essentiality:'nonessential' },
      { id:'beauty',        name:'Beleza',        icon:'✨',  color:'#79b7ae', essentiality:'nonessential' },
      { id:'travel',        name:'Viagem',        icon:'✈️',  color:'#54a7b9', essentiality:'nonessential' },
      { id:'education',     name:'Educação',      icon:'📚',  color:'#2ba18a', essentiality:'investment' },
      { id:'invest',        name:'Investimentos', icon:'📈',  color:'#4ecc73', essentiality:'investment' },
      { id:'other',         name:'Outros',        icon:'◈',   color:'#7f9ea5', essentiality:'nonessential' },
    ],
    paymentMethods: [
      { id:'pix',      label:'⚡ Pix' },
      { id:'credit',   label:'💳 Crédito' },
      { id:'debit',    label:'🏦 Débito' },
      { id:'cash',     label:'💵 Dinheiro' },
      { id:'boleto',   label:'📄 Boleto' },
      { id:'va',       label:'🍽 Vale Alim.' },
      { id:'vr',       label:'🛒 Vale Ref.' },
      { id:'transfer', label:'↔ Transferência' },
    ],

    async init() {
      const today = new Date().toISOString().split('T')[0]
      this.newTx.date = today
      this.newInc.date = today
      this.newRecurring.startDate = today
      this.newRecurring.dayOfMonth = new Date().getDate()
      const t = localStorage.getItem('gastos_theme')
      if (t) this.theme = t

      const saved = localStorage.getItem('gastos_session')
      if (saved) {
        try {
          const s = JSON.parse(saved)
          this.token = s.token
          this.currentUser = s.user
          API.setToken(this.token)
          await this.loadAccountsAndData(localStorage.getItem('gastos_active_account_id'))
          this.loggedIn = true
        } catch {
          localStorage.removeItem('gastos_session')
          localStorage.removeItem('gastos_active_account_id')
          API.setToken('')
          API.setAccount('')
        }
      }
      this.loading = false
      this.$nextTick(() => this.syncDatePickers())
    },

    async doLogin() {
      this.loginError = ''
      if (!this.loginForm.email || !this.loginForm.password) {
        this.loginError = 'Preencha todos os campos.'
        return
      }
      this.authLoading = true
      try {
        const data = await API.post('/api/auth/login', this.loginForm)
        await this._loginSuccess(data)
      } catch (e) {
        this.loginError = e.message
      } finally {
        this.authLoading = false
      }
    },

    async doRegister() {
      this.loginError = ''
      if (!this.regForm.name || !this.regForm.email || !this.regForm.password || !this.regForm.passwordConfirmation) {
        this.loginError = 'Preencha todos os campos.'
        return
      }
      if (this.regForm.password.length < 6) {
        this.loginError = 'Senha deve ter ao menos 6 caracteres.'
        return
      }
      if (this.regForm.password !== this.regForm.passwordConfirmation) {
        this.loginError = 'As senhas não coincidem.'
        return
      }
      this.authLoading = true
      try {
        const data = await API.post('/api/auth/register', this.regForm)
        await this._loginSuccess(data)
      } catch (e) {
        this.loginError = e.message
      } finally {
        this.authLoading = false
      }
    },

    async _loginSuccess(data) {
      this.token = data.token
      this.currentUser = data.user
      API.setToken(this.token)
      localStorage.setItem('gastos_session', JSON.stringify({ token: this.token, user: this.currentUser }))
      await this.loadAccountsAndData()
      this.loggedIn = true
      this.loginForm = { email: '', password: '' }
      this.regForm = { name: '', email: '', password: '', passwordConfirmation: '' }
    },

    doLogout() {
      localStorage.removeItem('gastos_session')
      localStorage.removeItem('gastos_active_account_id')
      this.loggedIn = false
      this.token = ''
      this.accounts = []
      this.activeAccountId = ''
      this.accountMembers = []
      this.expenses = []
      this.incomes = []
      this.goals = []
      this.recurringExpenses = []
      this.currentUser = { name: '', email: '' }
      this.loginMode = 'login'
      this.loginError = ''
      this.accountForm = { name: '' }
      this.renameAccountName = ''
      this.shareForm = { email: '', role: 'reader' }
      this.editingExpenseId = ''
      this.editingIncomeId = ''
      this.editingGoalCategory = ''
      this.editingRecurringId = ''
      this.resetExpenseForm()
      this.resetIncomeForm()
      this.resetGoalForm()
      this.resetRecurringForm()
