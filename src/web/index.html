      API.setToken('')
      API.setAccount('')
      this.resetCharts()
      this.syncDatePickers()
      this.toast('Até logo!')
    },

    async loadAccountsAndData(preferredID = '') {
      this.accounts = await API.get('/api/accounts') || []
      this.setActiveAccount(this.resolveAccountID(preferredID))
      await Promise.all([this.loadAllData(), this.refreshAccountMembers()])
    },

    resolveAccountID(preferredID = '') {
      const desired = String(preferredID || this.activeAccountId || localStorage.getItem('gastos_active_account_id') || '')
      const account = this.accounts.find(item => String(item.id) === desired)
      if (account) return account.id
      return this.accounts[0]?.id || ''
    },

    setActiveAccount(id) {
      this.activeAccountId = id ? String(id) : ''
      API.setAccount(this.activeAccountId)
      if (this.activeAccountId) {
        localStorage.setItem('gastos_active_account_id', this.activeAccountId)
      } else {
        localStorage.removeItem('gastos_active_account_id')
      }
      this.renameAccountName = this.activeAccount?.name || ''
      this.activeFilter = 'all'
      this.cancelExpenseEdit()
      this.cancelIncomeEdit()
      this.cancelGoalEdit()
      this.cancelRecurringEdit()
      this.syncDatePickers()
    },

    async switchAccount(id) {
      const nextID = String(id)
      if (!nextID || nextID === this.activeAccountId) return
      this.setActiveAccount(nextID)
      await Promise.all([this.loadAllData(), this.refreshAccountMembers()])
    },

    async loadAllData() {
      if (!this.hasActiveAccount) {
        this.expenses = []
        this.incomes = []
        this.goals = []
        this.recurringExpenses = []
        this.resetCharts()
        return
      }

      const [expenses, incomes, goals, recurringExpenses] = await Promise.all([
        API.get('/api/expenses'),
        API.get('/api/incomes'),
        API.get('/api/goals'),
        API.get('/api/recurring-expenses'),
      ])
      this.expenses = expenses || []
      this.incomes = incomes || []
      this.goals = goals || []
      this.recurringExpenses = recurringExpenses || []

      if (this.page === 'charts') {
        setTimeout(() => this.renderCharts(), 0)
      }
    },

    async refreshAccountMembers() {
      if (!this.hasActiveAccount) {
        this.accountMembers = []
        return
      }

      this.accountMembers = await API.get('/api/accounts/' + this.activeAccountId + '/members') || []
      if (!this.editingExpenseId) this.resetSplitPercentages(this.newTx)
      if (!this.editingRecurringId) this.resetSplitPercentages(this.newRecurring)
    },

    async createAccount() {
      const name = this.accountForm.name.trim()
      if (!name) {
        this.toast('Informe um nome para a conta.', true)
        return
      }
      this.accountLoading = true
      try {
        const account = await API.post('/api/accounts', { name })
        this.accountForm.name = ''
        await this.loadAccountsAndData(account.id)
        this.toast('Conta criada ✓')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.accountLoading = false
      }
    },

    async renameActiveAccount() {
      if (!this.isAccountOwner || !this.hasActiveAccount) return
      const name = this.renameAccountName.trim()
      if (!name) {
        this.toast('Informe um nome para a conta.', true)
        return
      }
      this.accountLoading = true
      try {
        await API.patch('/api/accounts/' + this.activeAccountId, { name })
        await this.loadAccountsAndData(this.activeAccountId)
        this.toast('Conta renomeada ✓')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.accountLoading = false
      }
    },

    async deleteActiveAccount() {
      if (!this.isAccountOwner || !this.hasActiveAccount) return
      if (!window.confirm('Tem certeza que deseja excluir esta conta e todos os dados dela?')) return
      this.accountLoading = true
      try {
        await API.delete('/api/accounts/' + this.activeAccountId)
        await this.loadAccountsAndData()
        this.toast('Conta excluída.')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.accountLoading = false
      }
    },

    async leaveActiveAccount() {
      if (!this.hasActiveAccount || this.isAccountOwner) return
      if (!window.confirm('Sair desta conta compartilhada? Você perderá o acesso imediato a essa carteira.')) return
      this.accountLoading = true
      try {
        await API.delete('/api/accounts/' + this.activeAccountId + '/members/' + this.currentUser.id)
        await this.loadAccountsAndData()
        this.toast('Você saiu da conta compartilhada.')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.accountLoading = false
      }
    },

    async shareAccount() {
      if (!this.canManageMembers || !this.hasActiveAccount) return
      const email = this.shareForm.email.trim().toLowerCase()
      if (!email) {
        this.toast('Informe um e-mail válido.', true)
        return
      }
      this.membersLoading = true
      try {
        await API.post('/api/accounts/' + this.activeAccountId + '/members', {
          email,
          role: this.shareForm.role,
        })
        this.shareForm = { email: '', role: 'reader' }
        await this.refreshAccountMembers()
        this.toast('Conta compartilhada ✓')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.membersLoading = false
      }
    },

    async changeMemberRole(userID, role) {
      if (!this.canManageMembers || !this.hasActiveAccount) return
      this.membersLoading = true
      try {
        await API.patch('/api/accounts/' + this.activeAccountId + '/members/' + userID, { role })
        await this.refreshAccountMembers()
        this.toast('Papel atualizado ✓')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.membersLoading = false
      }
    },

    async removeMember(userID) {
      if (!this.canManageMembers || !this.hasActiveAccount) return
      if (!window.confirm('Remover este membro da conta?')) return
      this.membersLoading = true
      try {
        await API.delete('/api/accounts/' + this.activeAccountId + '/members/' + userID)
        await this.refreshAccountMembers()
        this.toast('Membro removido.')
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.membersLoading = false
      }
    },

    resetExpenseForm() {
      this.newTx = {
        amount: '0,00',
        description: '',
        category: 'food',
        payment: 'pix',
        date: new Date().toISOString().split('T')[0],
        splits: this.buildDefaultSplits(),
      }
      this.$nextTick(() => this.syncDatePickers())
    },

    resetIncomeForm() {
      this.newInc = {
        amount: '0,00',
        description: '',
        type: 'salary',
        date: new Date().toISOString().split('T')[0],
      }
      this.$nextTick(() => this.syncDatePickers())
    },

    resetGoalForm() {
      this.newGoal = { category: 'food', limit: '0,00' }
    },

    resetRecurringForm() {
      this.newRecurring = {
        amount: '0,00',
        description: '',
        category: 'subscriptions',
        payment: 'credit',
        frequency: 'monthly',
        dayOfMonth: new Date().getDate(),
        startDate: new Date().toISOString().split('T')[0],
        endDate: '',
        enabled: true,
        splits: this.buildDefaultSplits(),
      }
      this.$nextTick(() => this.syncDatePickers())
    },

    startEditExpense(tx) {
      this.editingExpenseId = String(tx.id)
      this.newTx = { amount: this.moneyToInput(tx.amount), description: tx.description, category: tx.category, payment: tx.payment, date: tx.date, splits: this.formSplitsFrom(tx.splits) }
      this.$nextTick(() => this.syncDatePickers())
    },

    cancelExpenseEdit() {
      this.editingExpenseId = ''
      this.resetExpenseForm()
    },

    async submitExpense() {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) {
        this.toast('Você não pode editar esta conta.', true)
        return
      }
      const amount = this.parseCurrencyInput(this.newTx.amount)
      if (amount <= 0) {
        this.toast('Informe um valor válido.', true)
        return
      }
      this.savingExpense = true
      try {
        const payload = {
          amount,
          description: this.newTx.description.trim(),
          category: this.newTx.category,
          payment: this.newTx.payment,
          date: this.newTx.date || new Date().toISOString().split('T')[0],
          splits: this.normalizedFormSplits(this.newTx.splits),
        }
        const e = this.editingExpenseId
          ? await API.patch('/api/expenses/' + this.editingExpenseId, payload)
          : await API.post('/api/expenses', payload)

        if (this.editingExpenseId) {
          this.expenses = this.expenses.map(item => item.id === e.id ? e : item)
          this.toast('Gasto atualizado ✓')
        } else {
          this.expenses.push(e)
          this.toast('Gasto adicionado ✓')
        }
        this.cancelExpenseEdit()
        const goal = this.goals.find(g => g.category === e.category)
        if (goal) {
          const spent = this.expensesMonth.filter(x => x.category === e.category).reduce((s, x) => s + x.amount, 0)
          if (spent >= goal.limit) this.toast('⚠ Meta de ' + this.getCatName(e.category) + ' excedida!', true)
        }
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.savingExpense = false
      }
    },

    async deleteExpense(id) {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) return
      try {
        await API.delete('/api/expenses/' + id)
        this.expenses = this.expenses.filter(e => e.id !== id)
        if (String(id) === this.editingExpenseId) this.cancelExpenseEdit()
        this.toast('Removido.')
      } catch (err) {
        this.toast(err.message, true)
      }
    },

    startEditIncome(tx) {
      this.editingIncomeId = String(tx.id)
      this.newInc = { amount: this.moneyToInput(tx.amount), description: tx.description, type: tx.type, date: tx.date }
      this.$nextTick(() => this.syncDatePickers())
    },

    cancelIncomeEdit() {
      this.editingIncomeId = ''
      this.resetIncomeForm()
    },

    async submitIncome() {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) {
        this.toast('Você não pode editar esta conta.', true)
        return
      }
      const amount = this.parseCurrencyInput(this.newInc.amount)
      if (amount <= 0) {
        this.toast('Informe um valor válido.', true)
        return
      }
      this.savingIncome = true
      try {
        const payload = {
          amount,
          description: this.newInc.description.trim(),
          type: this.newInc.type,
          date: this.newInc.date || new Date().toISOString().split('T')[0],
        }
        const inc = this.editingIncomeId
          ? await API.patch('/api/incomes/' + this.editingIncomeId, payload)
          : await API.post('/api/incomes', payload)
        if (this.editingIncomeId) {
          this.incomes = this.incomes.map(item => item.id === inc.id ? inc : item)
          this.toast('Entrada atualizada ✓')
        } else {
          this.incomes.push(inc)
          this.toast('Entrada adicionada ✓')
        }
        this.cancelIncomeEdit()
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.savingIncome = false
      }
    },

    async deleteIncome(id) {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) return
      try {
        await API.delete('/api/incomes/' + id)
        this.incomes = this.incomes.filter(e => e.id !== id)
        if (String(id) === this.editingIncomeId) this.cancelIncomeEdit()
        this.toast('Removido.')
      } catch (err) {
        this.toast(err.message, true)
      }
    },

    startEditGoal(goal) {
      this.editingGoalCategory = goal.category
      this.newGoal = { category: goal.category, limit: this.moneyToInput(goal.limit) }
    },

    cancelGoalEdit() {
      this.editingGoalCategory = ''
      this.resetGoalForm()
    },

    async submitGoal() {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) {
        this.toast('Você não pode editar esta conta.', true)
        return
      }
      const limit = this.parseCurrencyInput(this.newGoal.limit)
      if (limit <= 0) {
        this.toast('Informe um limite válido.', true)
        return
      }
      try {
        const payload = {
          category: this.newGoal.category,
          limit,
        }
        const g = this.editingGoalCategory
          ? await API.patch('/api/goals/' + this.editingGoalCategory, payload)
          : await API.post('/api/goals', payload)
        this.goals = this.goals.filter(x => x.category !== g.category)
        if (this.editingGoalCategory && this.editingGoalCategory !== g.category) {
          this.goals = this.goals.filter(x => x.category !== this.editingGoalCategory)
        }
        this.goals.push(g)
        this.toast(this.editingGoalCategory ? 'Meta atualizada ✓' : 'Meta definida ✓')
        this.cancelGoalEdit()
      } catch (err) {
        this.toast(err.message, true)
      }
    },

    async deleteGoal(category) {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) return
      try {
        await API.delete('/api/goals/' + category)
        this.goals = this.goals.filter(g => g.category !== category)
        if (category === this.editingGoalCategory) this.cancelGoalEdit()
        this.toast('Meta removida.')
      } catch (err) {
        this.toast(err.message, true)
      }
    },

    startEditRecurringExpense(item) {
      this.editingRecurringId = String(item.id)
      this.newRecurring = {
        amount: this.moneyToInput(item.amount),
        description: item.description,
        category: item.category,
        payment: item.payment,
        frequency: item.frequency || 'monthly',
        dayOfMonth: item.dayOfMonth,
        startDate: item.startDate,
        endDate: item.endDate || '',
        enabled: !!item.enabled,
        splits: this.formSplitsFrom(item.splits),
      }
      this.$nextTick(() => this.syncDatePickers())
    },

    cancelRecurringEdit() {
      this.editingRecurringId = ''
      this.resetRecurringForm()
    },

    async submitRecurringExpense() {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) {
        this.toast('Você não pode editar esta conta.', true)
        return
      }
      const amount = this.parseCurrencyInput(this.newRecurring.amount)
      if (amount <= 0) {
        this.toast('Informe um valor válido.', true)
        return
      }
      this.savingRecurring = true
      try {
        const payload = {
          amount,
          description: this.newRecurring.description.trim(),
          category: this.newRecurring.category,
          payment: this.newRecurring.payment,
          frequency: this.newRecurring.frequency || 'monthly',
          dayOfMonth: Number(this.newRecurring.dayOfMonth || 0),
          startDate: this.newRecurring.startDate,
          endDate: this.newRecurring.endDate || '',
          enabled: !!this.newRecurring.enabled,
          splits: this.normalizedFormSplits(this.newRecurring.splits),
        }
        const recurring = this.editingRecurringId
          ? await API.patch('/api/recurring-expenses/' + this.editingRecurringId, payload)
          : await API.post('/api/recurring-expenses', payload)

        if (this.editingRecurringId) {
          this.recurringExpenses = this.recurringExpenses.map(item => item.id === recurring.id ? recurring : item)
          this.toast('Recorrência atualizada ✓')
        } else {
          this.recurringExpenses.push(recurring)
          this.toast('Recorrência configurada ✓')
        }
        this.cancelRecurringEdit()
      } catch (err) {
        this.toast(err.message, true)
      } finally {
        this.savingRecurring = false
      }
    },

    async deleteRecurringExpense(id) {
      if (!this.canEditActiveAccount || !this.hasActiveAccount) return
      try {
        await API.delete('/api/recurring-expenses/' + id)
        this.recurringExpenses = this.recurringExpenses.filter(item => item.id !== id)
        if (String(id) === this.editingRecurringId) this.cancelRecurringEdit()
        this.toast('Recorrência removida.')
      } catch (err) {
        this.toast(err.message, true)
      }
    },

    formatCurrencyInput(value) {
      const digits = String(value || '').replace(/\D/g, '')
      const normalized = digits === '' ? '000' : digits.padStart(3, '0')
      const cents = normalized.slice(-2)
      let units = normalized.slice(0, -2).replace(/^0+(?=\d)/, '')
      if (units === '') units = '0'
      return units.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + cents
    },

    parseCurrencyInput(value) {
      const normalized = this.formatCurrencyInput(value)
      const digits = normalized.replace(/\D/g, '')
      return Number(digits) / 100
    },

    moneyToInput(value) {
      return this.formatCurrencyInput(Math.round(Number(value || 0) * 100))
    },

    buildDefaultSplits() {
      const members = this.accountMembers.length
        ? this.accountMembers
        : [{ userId: this.currentUser.id, name: this.currentUser.name, email: this.currentUser.email }]
      if (!members.length) return []
      const base = Math.floor((100 / members.length) * 100) / 100
      let used = 0
      return members.map((member, index) => {
        const percentage = index === members.length - 1 ? Number((100 - used).toFixed(2)) : base
        used += percentage
        return {
          userId: member.userId,
          name: member.name,
          email: member.email,
          percentage,
        }
      })
    },

    formSplitsFrom(splits = []) {
      if (!splits.length) return this.buildDefaultSplits()
      return splits.map(split => ({
        userId: split.userId,
        name: split.name || this.accountMembers.find(member => member.userId === split.userId)?.name || 'Participante',
        email: split.email || '',
        percentage: Number(split.percentage || 0),
      }))
    },

    resetSplitPercentages(target) {
      target.splits = this.buildDefaultSplits()
    },

    normalizedFormSplits(splits = []) {
      return splits
        .filter(split => Number(split.percentage || 0) > 0)
        .map(split => ({ userId: split.userId, percentage: Number(split.percentage || 0) }))
    },

    splitTotal(splits = []) {
      return splits.reduce((sum, split) => sum + Number(split.percentage || 0), 0)
    },

    splitAmountPreview(amountInput, percentage) {
      const amount = typeof amountInput === 'number' ? amountInput : this.parseCurrencyInput(amountInput)
      return Math.round(amount * Number(percentage || 0)) / 100
    },

    splitSummary(item) {
      const splits = item?.splits || []
      if (!splits.length) return 'sem racha'
      if (splits.length === 1) return splits[0].name + ' · 100%'
      return splits.map(split => split.name + ' ' + Number(split.percentage || 0).toFixed(0) + '%').join(' · ')
    },

    bindDatePicker(el, target, field, options = {}) {
      const picker = flatpickr(el, {
        dateFormat: 'Y-m-d',
        defaultDate: target[field] || null,
        disableMobile: true,
        monthSelectorType: 'static',
        locale: {
          firstDayOfWeek: 1,
          weekdays: {
            shorthand: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'],
            longhand: ['Domingo', 'Segunda', 'Terca', 'Quarta', 'Quinta', 'Sexta', 'Sabado'],
          },
          months: {
            shorthand: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
            longhand: ['Janeiro', 'Fevereiro', 'Marco', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'],
          },
        },
        onChange: (selectedDates, dateStr) => {
          target[field] = dateStr || ''
        },
        ...options,
      })
      this._datePickers.push({ picker, target, field })
    },

    syncDatePickers() {
      this._datePickers.forEach(entry => {
        const value = entry.target?.[entry.field] || ''
        entry.picker.setDate(value || null, false, 'Y-m-d')
      })
    },

    prevMonth() {
      if (this.currentMonth === 0) { this.currentMonth = 11; this.currentYear-- }
      else this.currentMonth--
      this.activeFilter = 'all'
    },

    nextMonth() {
      if (this.currentMonth === 11) { this.currentMonth = 0; this.currentYear++ }
      else this.currentMonth++
      this.activeFilter = 'all'
    },

    get monthLabel() {
      return new Date(this.currentYear, this.currentMonth).toLocaleString('pt-BR', { month: 'long' })
    },

    get activeAccount() {
      return this.accounts.find(account => String(account.id) === String(this.activeAccountId)) || null
    },

    get hasActiveAccount() {
      return !!this.activeAccount
    },

    get activeAccountName() {
      return this.activeAccount?.name || 'Sem conta'
    },

    get activeAccountOwnerName() {
      return this.activeAccount?.ownerName || '—'
    },

    get activeRole() {
      return this.activeAccount?.role || ''
    },

    get canEditActiveAccount() {
      return !!this.activeAccount?.permissions?.canEdit
    },

    get canManageMembers() {
      return !!this.activeAccount?.permissions?.canManageMembers
    },

    get isAccountOwner() {
      return this.activeRole === 'owner'
    },

    get isAccountReadOnly() {
      return this.activeRole === 'reader'
    },

    get expensesMonth() {
      return this.expenses.filter(e => {
        const d = new Date(e.date + 'T12:00:00')
        return d.getMonth() === this.currentMonth && d.getFullYear() === this.currentYear
      })
    },

    get incomeMonth() {
      return this.incomes.filter(e => {
        const d = new Date(e.date + 'T12:00:00')
        return d.getMonth() === this.currentMonth && d.getFullYear() === this.currentYear
      })
    },

    get totalExpenses() { return this.expensesMonth.reduce((s, e) => s + e.amount, 0) },
    get totalIncome() { return this.incomeMonth.reduce((s, e) => s + e.amount, 0) },
    get balance() { return this.totalIncome - this.totalExpenses },

    get daysElapsed() {
      const now = new Date()
      if (this.currentMonth === now.getMonth() && this.currentYear === now.getFullYear()) return now.getDate()
      return new Date(this.currentYear, this.currentMonth + 1, 0).getDate()
    },

    get dailyAvg() { return this.daysElapsed > 0 ? this.totalExpenses / this.daysElapsed : 0 },
    get essentialTotal() { return this.expensesMonth.filter(e => this.getCatEss(e.category) === 'essential').reduce((s, e) => s + e.amount, 0) },
    get nonEssentialTotal() { return this.expensesMonth.filter(e => this.getCatEss(e.category) === 'nonessential').reduce((s, e) => s + e.amount, 0) },
    get investmentTotal() { return this.expensesMonth.filter(e => this.getCatEss(e.category) === 'investment').reduce((s, e) => s + e.amount, 0) },

    get categoryTotals() {
      const map = {}
      this.expensesMonth.forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount })
      const max = Math.max(...Object.values(map), 1)
      return this.categories.filter(c => map[c.id])
        .map(c => ({ ...c, total: map[c.id] || 0, pct: ((map[c.id] || 0) / max * 100) }))
        .sort((a, b) => b.total - a.total)
    },

    get recentExpenses() {
      return [...this.expensesMonth].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 7)
    },

    get filteredExpenses() {
      return this.expensesMonth.filter(e => {
        if (this.activeFilter === 'all') return true
        if (['essential', 'nonessential', 'investment'].includes(this.activeFilter)) {
          return this.getCatEss(e.category) === this.activeFilter
        }
        return e.category === this.activeFilter
      })
    },

    get groupedExpenses() {
      const sorted = [...this.filteredExpenses].sort((a, b) => new Date(b.date) - new Date(a.date))
      const groups = {}
      sorted.forEach(tx => {
        if (!groups[tx.date]) groups[tx.date] = []
        groups[tx.date].push(tx)
      })
      return Object.entries(groups).map(([date, items]) => ({ date, label: this.formatDate(date), items }))
    },

    get groupedIncome() {
      const sorted = [...this.incomeMonth].sort((a, b) => new Date(b.date) - new Date(a.date))
      const groups = {}
      sorted.forEach(tx => {
        if (!groups[tx.date]) groups[tx.date] = []
        groups[tx.date].push(tx)
      })
      return Object.entries(groups).map(([date, items]) => ({ date, label: this.formatDate(date), items }))
    },

    get goalsWithProgress() {
      const map = {}
      this.expensesMonth.forEach(e => { map[e.category] = (map[e.category] || 0) + e.amount })
      return this.goals.map(g => ({
        ...g,
        spent: map[g.category] || 0,
        pct: ((map[g.category] || 0) / g.limit) * 100,
      })).sort((a, b) => b.pct - a.pct)
    },

    get userInitials() {
      return this.currentUser.name
        ? this.currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
        : '?'
    },

    resetCharts() {
      Object.values(this._charts).forEach(chart => chart?.destroy && chart.destroy())
      this._charts = {}
    },

    renderCharts() {
      if (!this.hasActiveAccount) {
        this.resetCharts()
        return
      }

      const isDark = this.theme === 'dark'
      const grid = isDark ? '#262b28' : '#e5e7e4'
      Chart.defaults.color = isDark ? '#8a9490' : '#6b7370'
      Chart.defaults.font = { family: 'Outfit', size: 11 }
      const destroy = id => { if (this._charts[id]) { this._charts[id].destroy(); delete this._charts[id] } }

      destroy('ess')
      this._charts.ess = new Chart(document.getElementById('chartEss'), {
        type: 'doughnut',
        data: {
          labels: ['Essencial', 'Não essencial', 'Investimento'],
          datasets: [{ data: [this.essentialTotal, this.nonEssentialTotal, this.investmentTotal], backgroundColor: ['#023848', '#d6a23a', '#4ecc73'], borderWidth: 0, hoverOffset: 8 }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 14, boxWidth: 10 } } }, cutout: '68%' },
      })

      destroy('pay')
      const pm = {}
      const pc = { pix: '#023848', credit: '#2b92a1', debit: '#1f7d8f', cash: '#d6a23a', boleto: '#7f9ea5', va: '#4ecc73', vr: '#66c3a1', transfer: '#2c9b88' }
      const pl = { pix: 'Pix', credit: 'Crédito', debit: 'Débito', cash: 'Dinheiro', boleto: 'Boleto', va: 'Vale Alim.', vr: 'Vale Ref.', transfer: 'Transf.' }
      this.expensesMonth.forEach(e => { pm[e.payment] = (pm[e.payment] || 0) + e.amount })
      const pk = Object.keys(pm)
      this._charts.pay = new Chart(document.getElementById('chartPay'), {
        type: 'doughnut',
        data: { labels: pk.map(k => pl[k] || k), datasets: [{ data: pk.map(k => pm[k]), backgroundColor: pk.map(k => pc[k] || '#94a3b8'), borderWidth: 0, hoverOffset: 8 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 12, boxWidth: 10 } } }, cutout: '68%' },
      })

      destroy('cat')
      const cd = this.categoryTotals.slice(0, 12)
      this._charts.cat = new Chart(document.getElementById('chartCat'), {
        type: 'bar',
        data: { labels: cd.map(c => c.icon + ' ' + c.name), datasets: [{ data: cd.map(c => c.total), backgroundColor: cd.map(c => c.color + 'bb'), borderRadius: 5, borderSkipped: false }] },
        options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: grid }, ticks: { callback: v => 'R$' + Number(v).toLocaleString('pt-BR') } }, y: { grid: { display: false } } } },
      })

      destroy('trend')
      const months = []
      for (let i = 5; i >= 0; i--) {
        let mo = this.currentMonth - i
        let yr = this.currentYear
        if (mo < 0) { mo += 12; yr-- }
        months.push({ mo, yr, label: new Date(yr, mo).toLocaleString('pt-BR', { month: 'short' }) })
      }
      const expD = months.map(({ mo, yr }) => this.expenses.filter(e => { const d = new Date(e.date + 'T12:00:00'); return d.getMonth() === mo && d.getFullYear() === yr }).reduce((s, e) => s + e.amount, 0))
      const incD = months.map(({ mo, yr }) => this.incomes.filter(e => { const d = new Date(e.date + 'T12:00:00'); return d.getMonth() === mo && d.getFullYear() === yr }).reduce((s, e) => s + e.amount, 0))
      this._charts.trend = new Chart(document.getElementById('chartTrend'), {
        type: 'line',
        data: {
          labels: months.map(m => m.label),
          datasets: [
            { label: 'Gastos', data: expD, borderColor: '#023848', backgroundColor: '#02384818', tension: .4, fill: true, pointRadius: 4, pointHoverRadius: 6 },
            { label: 'Entradas', data: incD, borderColor: '#4ecc73', backgroundColor: '#4ecc7318', tension: .4, fill: true, pointRadius: 4, pointHoverRadius: 6 },
          ],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', align: 'end', labels: { padding: 14, boxWidth: 10 } } }, scales: { x: { grid: { color: grid } }, y: { grid: { color: grid }, ticks: { callback: v => 'R$' + Number(v).toLocaleString('pt-BR') } } } },
      })
    },

    setTheme(t) {
      this.theme = t
      localStorage.setItem('gastos_theme', t)
      if (this.page === 'charts' && this.hasActiveAccount) {
        setTimeout(() => this.renderCharts(), 0)
      }
    },

    toast(msg, err = false) {
      const id = Date.now()
      this.toasts.push({ id, msg, err })
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id) }, 3100)
    },

    fmt(val) {
      return 'R$ ' + Number(val).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
    },

    formatDate(s) {
      const d = new Date(s + 'T12:00:00')
      const t = new Date()
      const y = new Date(t)
      y.setDate(t.getDate() - 1)
      if (d.toDateString() === t.toDateString()) return 'Hoje'
      if (d.toDateString() === y.toDateString()) return 'Ontem'
      return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })
    },

    formatDateLong(s) {
      if (!s) return '—'
      return new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })
    },

    roleLabel(role) {
      return { owner: 'Owner', editor: 'Editor', reader: 'Leitor' }[role] || role
    },

    getCatIcon(id) { return this.categories.find(c => c.id === id)?.icon || '◈' },
    getCatName(id) { return this.categories.find(c => c.id === id)?.name || id },
    getCatEss(id) { return this.categories.find(c => c.id === id)?.essentiality || 'nonessential' },
    essLabel(e) { return { essential: 'essencial', nonessential: 'não-essencial', investment: 'investimento' }[e] || e },
    payLabel(id) { return (this.paymentMethods.find(p => p.id === id)?.label || id).replace(/^.\s/, '') },
    incTypeIcon(t) { return { salary: '💼', freelance: '💻', investment: '📈', gift: '🎁', other: '◈' }[t] || '◈' },
    incTypeLabel(t) { return { salary: 'Salário', freelance: 'Freelance', investment: 'Rendimentos', gift: 'Presente', other: 'Outros' }[t] || t },
  }
}
</script>
</body>
